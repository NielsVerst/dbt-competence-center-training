version: 2

models:
  - name: curated_customer_orders
    description: "Omzet en aantal orders per klant, klaar voor rapportage."
    columns:
      - name: customer_id
        description: "Unieke identifier van de klant."
        tests:
          - unique
          - not_null
      - name: totale_omzet
        description: "Som van order_amount over alle orders van de klant."

  - name: curated_product_sales
    description: "Verdieping: één rij per product met het aantal verkochte units en totale inkomsten."
    columns:
      - name: product_id
        description: "Unieke identifier van het product."
        tests:
          - unique
          - not_null
      - name: category
        description: "Categorie van het product."
        tests:
          - accepted_values:
              values: ['electronics', 'home']
