version: 2

models:
  - name: stg_orders
    description: "Eén rij per order, opgeschoond: status in kleine letters, bedrag gecast naar numeric(10,2)."
    columns:
      - name: order_id
        description: Primaire sleutel van de order.
        tests:
          - unique
          - not_null
      - name: order_status
        description: Orderstatus in kleine letters (bijv. 'shipped', 'open', 'cancelled').
        tests:
          - accepted_values:
              arguments:
                values: ['open', 'shipped', 'cancelled']
      - name: customer_id
        description: Vreemde sleutel naar stg_customers.
        tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

  - name: stg_customers
    description: "Eén rij per klant, opgeschoond: naam getrimd, land in hoofdletters als country_code."
    columns:
      - name: customer_id
        description: Primaire sleutel van de klant.
        tests:
          - unique
          - not_null

  - name: stg_products
    description: "Verdieping: één rij per product, opgeschoond: naam getrimd, categorie in kleine letters."
    columns:
      - name: product_id
        description: Primaire sleutel van het product.
        tests:
          - unique
          - not_null

  - name: stg_order_items
    description: "Verdieping: één rij per orderregel."
    columns:
      - name: order_item_id
        description: Primaire sleutel van de orderregel.
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: product_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
