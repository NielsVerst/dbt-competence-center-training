version: 2

models:
  - name: curated_customer_orders
    description: "Omzet en aantal orders per klant, klaar voor rapportage."
    columns:
      - name: customer_id
        description: "Unieke identifier van de klant."
        tests:
          - unique
          - not_null
      - name: totale_omzet
        description: "Som van order_amount over alle orders van de klant."

  - name: curated_product_sales
    description: "Verdieping: one row per product with units sold and total revenue."
    columns:
      - name: product_id
        description: Primary key of the product.
        tests:
          - unique
          - not_null
      - name: category
        tests:
          - accepted_values:
              values: ['electronics', 'home']
